[project]
name = "airbnb-eodp"
version = "0.1.0"
description = "COMP20008 Group Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
# This codebase is written in an "annotated" style: one short statement per line
# with a full-width trailing comment aligned in a column. Two consequences:
#  - line-length is raised, so import sorting does not re-wrap statements that are
#    only long because of their trailing comment;
#  - notebooks are excluded from formatting entirely, because ruff's formatter
#    collapses the comment padding to two spaces and re-splits multi-line
#    statements. The pattern must be a glob -- a bare directory name does not match.
# Delete the exclude below only if the whole codebase is being restyled.
line-length = 200

[tool.ruff.format]
exclude = ["*.ipynb"]
